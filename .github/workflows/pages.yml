name: pages
# 서버별 관측 페이지(B유형: 선언 패키지 상태) → lowdown-pages/docs (GitHub Pages: main /docs)
# PyPI 스냅샷(pypi.yml)이 끝나면 돈다(npm 은 그보다 1시간 앞). 스냅샷이 실패해도 직전 상태로 만든다.
# 읽기만 한다(scanner secret key). 바뀐 파일만 커밋한다. 페이지는 지우지 않는다(scanner/pages.ts).

on:
  workflow_run:
    workflows: [pypi]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '계산만 (파일·커밋 없음)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

concurrency:
  group: lowdown-pages-push
  cancel-in-progress: false

jobs:
  pages:
    # ubuntu-latest 는 2026-10-19부터 26.04로 바뀐다. 검증 전까지 24.04 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # lowdown-pages 는 README 등으로 초기화된(비어 있지 않은) 레포여야 한다.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/lowdown-pages
          # 만료 없는 deploy key(lowdown-pages 레포에 쓰기 권한으로 등록)
          ssh-key: ${{ secrets.LOWDOWN_PAGES_DEPLOY_KEY }}
          path: pages-repo

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate server pages
        run: node scanner/pages.ts pages-repo ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        working-directory: pages-repo
        run: |
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          echo "changed files: $(git diff --cached --name-only | wc -l)"
          git commit -m "pages: server records $(date -u +%F)"
          git pull --rebase
          git push
          echo "repo size (git objects): $(du -sh .git/objects | cut -f1)"

      - name: Open issue on failure
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "pages 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"