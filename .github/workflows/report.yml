name: report

# 1단계: 수동 실행 전용 (집계·Markdown 생성·커밋이 안정적인지 2~3회 확인용)
# 2단계: 검증 후 scanner.yml 에 `needs: scan` job 으로 연결 (Scanner 성공 시에만 일일 갱신)

on:
  workflow_dispatch:

permissions:
  contents: read

# lowdown-data 에 쓰는 워크플로(report, backup)는 같은 그룹으로 직렬화한다
concurrency:
  group: lowdown-data-push
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lowdown-data
          token: ${{ secrets.LOWDOWN_DATA_TOKEN }}
          path: data-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate REPORT.md
        run: node scanner/report.ts data-repo
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Commit and push
        working-directory: data-repo
        run: |
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add REPORT.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "report: REPORT.md $(date -u +%F)"
          git pull --rebase
          git push