name: report

# 수동 실행 3회 검증 완료(10/10~10/11) → scanner.yml 의 report job(needs: scan)이 호출한다(workflow_call).
# Scanner 가 실제로 관찰을 저장한 실행 뒤에만 갱신된다. 수동 실행도 계속 가능.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

jobs:
  report:
    # lowdown-data 에 쓰는 작업(report, backup)은 같은 그룹으로 직렬화한다.
    # scanner.yml 에서 호출(workflow_call)될 때도 적용되도록 워크플로가 아니라 job 에 둔다.
    concurrency:
      group: lowdown-data-push
      cancel-in-progress: false
    # ubuntu-latest 는 2026-10-19부터 26.04로 바뀐다. 검증 전까지 24.04 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lowdown-data
          # 만료 없는 deploy key(lowdown-data 레포에 쓰기 권한으로 등록). 토큰 만료 위험 제거.
          ssh-key: ${{ secrets.LOWDOWN_DATA_DEPLOY_KEY }}
          path: data-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate REPORT.md
        run: node scanner/report.ts data-repo
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Commit and push
        working-directory: data-repo
        run: |
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add REPORT.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "report: REPORT.md $(date -u +%F)"
          git pull --rebase
          git push

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "report 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
