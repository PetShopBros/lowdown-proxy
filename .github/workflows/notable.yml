name: notable
# 레이다 1단계: 그날 npm·PyPI 패키지 이벤트 → scanner_notable (비공개, published=false)
# PyPI 스냅샷(pypi.yml)이 끝나면 돈다(npm 은 그보다 1시간 앞). 원자료는 읽기만 한다.
# 같은 날 다시 돌아도 이미 있는 행은 건너뛴다(예비 실행·수동 실행에 안전).

on:
  workflow_run:
    workflows: [pypi]
    types: [completed]
  workflow_dispatch:
    inputs:
      from:
        description: '이 날짜부터 오늘까지 채우기 (YYYY-MM-DD, 빈 값 = 오늘만)'
        type: string
        default: ''
      dry_run:
        description: '계산만 (DB 쓰기 없음)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

concurrency:
  group: notable
  cancel-in-progress: false

jobs:
  notable:
    # PyPI 스냅샷이 성공했을 때만 (실패한 날은 이벤트가 불완전할 수 있다)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Notable facts (private)
        run: node scanner/notable.ts ${{ inputs.from && format('--from={0}', inputs.from) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Open issue on failure
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "notable 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
