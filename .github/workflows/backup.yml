name: backup

# 날짜별 보관: 닫힌 날(UTC)마다 CSV.gz 1개 + MANIFEST.csv, 지난달은 Parquet 1개.
# 한 번 쓴 파일은 다시 쓰지 않는다(scanner/archive.ts, scanner/archive_parquet.py).

on:
  schedule:
    - cron: '43 0 * * *' # 매일 09:43 KST (UTC 00:43) — 전날(UTC) 관찰은 이미 끝난 시각
  workflow_dispatch:
    inputs:
      dry_run:
        description: '계산만 (파일·커밋 없음)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

concurrency:
  group: lowdown-data-push
  cancel-in-progress: false

jobs:
  archive:
    # ubuntu-latest 는 2026-10-19부터 26.04로 바뀐다. 검증 전까지 24.04 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # lowdown-data 는 README 등으로 초기화된(비어 있지 않은) 레포여야 한다.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lowdown-data
          # 만료 없는 deploy key(lowdown-data 레포에 쓰기 권한으로 등록). 토큰 만료 위험 제거.
          ssh-key: ${{ secrets.LOWDOWN_DATA_DEPLOY_KEY }}
          path: data-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyarrow
        run: pip install pyarrow==21.0.0

      - name: Archive closed days (CSV.gz + MANIFEST)
        id: archive
        run: node scanner/archive.ts data-repo ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Monthly Parquet (closed months)
        run: python scanner/archive_parquet.py data-repo ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        working-directory: data-repo
        run: |
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: archive $(date -u +%F)"
          git pull --rebase
          git push

      # 보관 뒤 DB 행 수가 바뀐 날이 있으면(보관 파일은 그대로) 알림
      - name: Audit mismatch
        if: steps.archive.outputs.audit_mismatch != '' && steps.archive.outputs.audit_mismatch != '0'
        run: |
          echo "::error::보관한 날의 DB 행 수가 MANIFEST 와 다릅니다: ${{ steps.archive.outputs.audit_mismatch }}일"
          exit 1

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "backup 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
