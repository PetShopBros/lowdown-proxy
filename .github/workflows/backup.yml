name: backup

on:
  schedule:
    - cron: '43 19 * * 0' # 매주 월요일 04:43 KST (UTC 일요일 19:43)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

concurrency:
  group: lowdown-data-push
  cancel-in-progress: false

jobs:
  export:
    # ubuntu-latest 는 2026-10-19부터 26.04로 바뀐다. 검증 전까지 24.04 고정.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # lowdown-data 는 README 등으로 초기화된(비어 있지 않은) 레포여야 한다.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lowdown-data
          # 만료 없는 deploy key(lowdown-data 레포에 쓰기 권한으로 등록). 토큰 만료 위험 제거.
          ssh-key: ${{ secrets.LOWDOWN_DATA_DEPLOY_KEY }}
          path: data-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Export scanner_observations to CSV
        run: node scanner/export.ts data-repo --months 2
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Commit and push
        working-directory: data-repo
        run: |
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: scanner_observations export $(date -u +%F)"
          git push

      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "backup 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"