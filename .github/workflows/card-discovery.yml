name: card-discovery

# 명함(카드) 확인(scanner/card-discovery.ts): Registry 원격 MCP 주소의 server-card 와 그 호스트의 ai-catalog·A2A agent-card·
# .well-known MCP 카드를 호스트마다 주 1회(하루 7분의 1) 확인한다. DB: supabase/2026-11-06_card_discovery.sql
# 본 관찰(scanner.yml) 뒤에 이어서 돈다(workflow_call). 실패해도 관찰에는 영향이 없다. 같은 날 두 번째 실행은 끝난 날이면 건너뛰고,
# 시간 상한에 걸려 남은 호스트가 있으면 이어서 한다.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '계산만 (DB 쓰기 없음)'
        type: boolean
        default: false
      slice:
        description: '요일 칸 0~6 (빈 값 = 오늘 칸)'
        type: string
        default: ''
      limit:
        description: '호스트 수 상한 (빈 값 = 전부)'
        type: string
        default: ''
      force:
        description: '오늘 끝났어도 다시 실행'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: card-discovery
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Card discovery
        run: >-
          node scanner/card-discovery.ts
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.slice && format('--slice={0}', inputs.slice) || '' }}
          ${{ inputs.limit && format('--limit={0}', inputs.limit) || '' }}
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}

      - name: Open issue on failure
        if: failure() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "card-discovery 실패 $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
