name: scanner
# 서버(sandbox/dispatch.sh)가 정시에 보낸 본 실행은 제목으로 구분한다(감시·중복 확인용)
run-name: ${{ inputs.daily && 'scanner daily (dispatch)' || github.workflow }}

on:
  schedule:
    # 본 실행은 서버(sandbox/dispatch.sh)가 10:17 KST 에 수동 실행(daily)으로 시작한다. GitHub 예약은 늦거나 빠질 수 있어 예비로만 둔다.
    # 예비 1: 10:17 KST (UTC 01:17). 오늘 관찰이 이미 있으면 건너뛴다(SKIP_IF_DONE). UTC 하루 앞쪽이라 몇 시간 늦어도 날짜가 넘어가지 않는다.
    - cron: '17 1 * * *'
    # 예비 2: 22:17 KST (UTC 13:17). 같은 규칙.
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      daily:
        description: '정시 본 실행 (서버 dispatch.sh 가 보냄 — 예약 실행과 같은 설정)'
        type: boolean
        default: false
      dry_run:
        description: 'DB에 쓰지 않고 결과만 출력'
        type: boolean
        default: false
      limit:
        description: '샘플 개수 (비우면 전체)'
        type: string
        default: ''
      cohort_version:
        description: '코호트 버전 (비우면 기본 2026-10-07-v1)'
        type: string
        default: ''
      cohort_size:
        description: '코호트 크기 (비우면 기본 2000)'
        type: string
        default: ''
      cohort_base:
        description: '확장 기준 코호트 (예: 2026-10-07-v1, 비우면 확장 안 함)'
        type: string
        default: ''
      plan_only:
        description: '선정 계산만 (probe·저장 없음, COHORT_BASE 필요)'
        type: boolean
        default: false
      registry_diff:
        description: 'Registry 비교 기록 (시장판 1단계)'
        type: boolean
        default: false
      cohort_host_cap:
        description: '확장 코호트 호스트당 상한 (비우면 상한 없음, COHORT_BASE 필요)'
        type: string
        default: ''
      first_seen:
        description: 'tool names + first observed (0.4.0)'
        type: boolean
        default: false


permissions:
  contents: read
  issues: write # 실패 시 이슈 생성(알림)

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    # ubuntu-latest 는 2026-10-19부터 26.04로 바뀐다. 검증 전까지 24.04 고정.
    runs-on: ubuntu-24.04
    # 5,000개 드라이런 시간 측정 전까지 여유 있게. 측정 후 실측 + 여유분으로 다시 정한다.
    timeout-minutes: 45
    outputs:
      scanned: ${{ steps.run.outputs.scanned }}
      registry_fallback: ${{ steps.run.outputs.registry_fallback }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run scanner
        id: run
        run: node scanner/scan.ts
        env:
          LOWDOWN_SUPABASE_URL: ${{ secrets.LOWDOWN_SUPABASE_URL }}
          LOWDOWN_SCANNER_KEY: ${{ secrets.LOWDOWN_SCANNER_KEY }}
          LOWDOWN_NODE_ID: ${{ secrets.LOWDOWN_NODE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SCAN_LIMIT: ${{ inputs.limit }}
          SKIP_IF_DONE: ${{ github.event_name == 'schedule' && '1' || '' }}
          COHORT_VERSION: ${{ inputs.cohort_version || '2026-10-19-v2' }}
          COHORT_SIZE: ${{ inputs.cohort_size || '5000' }}
          COHORT_BASE: ${{ inputs.cohort_base || '2026-10-07-v1' }}
          PLAN_ONLY: ${{ inputs.plan_only && '1' || '' }}
          REGISTRY_DIFF: ${{ (github.event_name == 'schedule' || inputs.daily || inputs.registry_diff) && '1' || '' }}
          FIRST_SEEN: ${{ (github.event_name == 'schedule' || inputs.daily || inputs.first_seen) && '1' || '' }}
          TOOL_DEFS: ${{ (github.event_name == 'schedule' || inputs.daily) && '1' || '' }}
          COHORT_HOST_CAP: ${{ inputs.cohort_host_cap || '3' }}
          # Registry 491페이지(2026-10-24), Actions 에서 페이지당 약 1.6초 → 8분 상한으로는 부족
          REGISTRY_BUDGET_SEC: '1200'

      # 저장하지 못한 관찰 행(scanner-unsaved-*.jsonl)이 있으면 보관(90일). 없으면 아무것도 올리지 않는다.
      - name: Upload unsaved observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-unsaved-${{ github.run_id }}
          path: scanner-unsaved-*.jsonl
          if-no-files-found: ignore
          retention-days: 90

      # artifact 는 90일 뒤 사라지므로 같은 행을 비공개 레포에 영구 보관한다(재적재 원본). 파일이 없으면 건너뛴다.
      - name: Checkout private repo (unsaved only)
        if: always() && hashFiles('scanner-unsaved-*.jsonl') != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lowdown-private
          ssh-key: ${{ secrets.LOWDOWN_PRIVATE_DEPLOY_KEY }}
          path: private-repo

      - name: Commit unsaved observations (private)
        if: always() && hashFiles('scanner-unsaved-*.jsonl') != ''
        working-directory: private-repo
        run: |
          day=$(date -u +%F)
          mkdir -p "unsaved/$day"
          for f in ../scanner-unsaved-*.jsonl; do
            gzip -c "$f" > "unsaved/$day/$(basename "$f").gz"
          done
          git config user.name "lowdown-bot"
          git config user.email "lowdown-bot@users.noreply.github.com"
          git add unsaved
          git commit -m "private: unsaved observations $day (run ${{ github.run_id }})"
          git pull --rebase
          git push

      - name: Open issue on registry fallback
        if: steps.run.outputs.registry_fallback == '1' && (github.event_name == 'schedule' || inputs.daily)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Registry 비교 건너뜀 $(date -u +%F) (목록 미수신, fallback)" \
            --body "관찰은 직전 주소로 진행됨. 시장판에는 'not compared'로 실림. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open issue on failure
        if: failure() && (github.event_name == 'schedule' || inputs.daily)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "scanner 실패 $(date -u +%F) (${{ github.event.schedule || 'daily dispatch' }})" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # 관찰을 실제로 저장한 실행 뒤에만 REPORT.md 갱신(예비 실행이 건너뛴 날, dry-run 은 제외)
  report:
    needs: scan
    if: needs.scan.outputs.scanned == '1'
    uses: ./.github/workflows/report.yml
    secrets: inherit
